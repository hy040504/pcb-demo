/**
 * 대시보드 KPI 카드에서 검사 이력 화면으로 필터를 적용해 이동한다.
 * @param {string} flt 'all' | 'NORMAL' | 'DEFECT' | 'PENDING'
 */
function gotoHistory(flt) { U.hf = { period: 'all', pcb: 'all', result: flt, q: '' }; go('history'); }

/* ═══════════════════════════════════════════════════════════════════════════
   6. [메뉴 2] PCB 검사 — PCB 선택 · 촬영/업로드 · PatchCore API 호출
   ═══════════════════════════════════════════════════════════════════════════ */
/* ═══════════════════════════════════════════════════════════════════════════
   6. [메뉴 2] PCB 검사 — PCB 종류 선택 · 여러 장 업로드(드래그 앤 드롭) · 일괄 검사
   ═══════════════════════════════════════════════════════════════════════════ */
/** 한 번에 올릴 수 있는 최대 이미지 수 (시연 기준 — 브라우저 메모리 보호) */
const MAX_BATCH = 50;

/**
 * PCB 종류 이름을 알아보기 쉬운 칩(칩 아이콘 + 이름)으로 표시한다.
 * PCB 종류는 '검사 대상 제품(기판)의 등록 이름'이며 정상 기준 사진이 아니다.
 * @param {string} name PCB 종류 이름(예: PCB1)
 * @returns {string} HTML
 */
function pcbTag(name) { return `<span class="ptype" title="PCB 종류 — 검사 대상 제품(기판)의 등록 이름">${ic('chip')}${esc(name)}</span>`; }

/**
 * 바이트 수를 읽기 쉬운 문자열로 바꾼다.
 * @param {number} b 바이트
 * @returns {string} 예: 1.2 MB
 */
function fmtBytes(b) { return b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(0) + ' KB' : (b / 1048576).toFixed(1) + ' MB'; }

/**
 * 검사 대기열 항목을 만든다.
 * @param {{name: string, src: string, size?: number, seed?: number, sample?: boolean}} o 이미지 정보
 * @returns {object} 대기열 항목 (st: wait | run | done)
 */
function newQueueItem(o) { return { uid: ++U.qSeq, name: o.name, src: o.src, key: o.key || '', size: o.size || 0, seed: o.seed || 7, sample: !!o.sample, st: 'wait', rec: null }; }

/** 대기열에 이미지를 추가하고 화면을 갱신한다. @param {object[]} list newQueueItem 입력 배열 */
function queueAdd(list) { list.forEach(o => U.queue.push(newQueueItem(o))); render(); }

/** 촬영 버튼: 샘플 촬영 이미지를 대기열에 추가한다 (시안 — 실제 카메라 연동은 시스템 설정의 카메라 항목에서 제공 예정). */
function capture() {
  if (U.running) return;
  if (U.queue.length >= MAX_BATCH) return toast(`한 번에 최대 ${MAX_BATCH}장까지 검사할 수 있습니다`);
  const k = U.capSeq = (U.capSeq || 0) + 1, pool = k % 2 ? SAMPLE_ANOM : SAMPLE_NORM, nm = pool[(k >> 1) % pool.length];   // 불량·정상 샘플을 번갈아 촬영한 것처럼 보여 준다(시안)
  queueAdd([{ ...sampleItem(nm), name: '촬영 이미지 ' + new Date().toTimeString().slice(0, 8) }]);
  toast('촬영 완료 — 대기열에 추가했습니다 (시안: 샘플 이미지)');
}

/** 샘플 세트(정상 기판 4 · 불량 6종 각 1장)를 대기열에 한 번에 추가한다. 파일명으로 정답 불량 위치가 연결된다. */
function loadSampleSet() {
  if (U.running) return;
  const names = [...SAMPLE_NORM.slice(0, 4), ...SAMPLE_ANOM.slice(0, 6)], room = MAX_BATCH - U.queue.length;
  if (room < names.length) return toast(`대기열 자리가 부족합니다 (${names.length}장 필요 · 최대 ${MAX_BATCH}장)`);
  queueAdd(names.map(sampleItem)); toast(`샘플 ${names.length}장을 추가했습니다 (공개 PCB 사진)`);
}

/** 파일 선택 창을 연다 (여러 장 선택 가능). */
function pickFile() { if (!U.running) document.getElementById('fileInput').click(); }

/**
 * 이미지 파일 여러 개를 읽어 검사 대기열에 추가한다 (이미지가 아닌 파일 · 최대 장수 초과분은 제외하고 안내).
 * @param {FileList|File[]} files 선택하거나 끌어다 놓은 파일들
 */
function addFiles(files) {
  if (U.running) return toast('검사 중에는 이미지를 추가할 수 없습니다');
  const all = [...files], imgs = all.filter(f => /^image\//.test(f.type) || /\.(png|jpe?g|bmp|webp)$/i.test(f.name));
  const skipType = all.length - imgs.length, room = Math.max(0, MAX_BATCH - U.queue.length), take = imgs.slice(0, room), skipMax = imgs.length - take.length;
  if (!take.length) return toast(skipType ? '이미지 파일(PNG · JPG · BMP · WebP)만 추가할 수 있습니다' : `한 번에 최대 ${MAX_BATCH}장까지 검사할 수 있습니다`);
  Promise.all(take.map(f => new Promise(res => { const fr = new FileReader(); fr.onload = () => res({ name: f.name, src: fr.result, size: f.size, seed: f.size + f.name.length }); fr.onerror = () => res(null); fr.readAsDataURL(f); })))
    .then(list => {
      list = list.filter(Boolean); queueAdd(list);
      toast(`${list.length}장을 추가했습니다` + (skipType ? ` · 이미지가 아닌 ${skipType}개 제외` : '') + (skipMax ? ` · 최대 ${MAX_BATCH}장 초과 ${skipMax}장 제외` : ''));
    });
}
document.getElementById('fileInput').addEventListener('change', e => { const arr = [...e.target.files]; e.target.value = ''; if (arr.length) addFiles(arr); });

/** 드롭 영역 위에 파일을 끌고 왔을 때 강조한다. */
function dzOver(e) { e.preventDefault(); e.currentTarget.classList.add('over'); }
/** 드롭 영역에서 벗어나면 강조를 끈다. */
function dzLeave(e) { e.currentTarget.classList.remove('over'); }
/**
 * 드롭 영역에 파일을 놓았을 때 대상에 맞게 처리한다.
 * @param {DragEvent} e 드롭 이벤트
 * @param {'queue'|'bank'} target queue=검사 대기열, bank=PCB 종류별 데이터뱅크
 */
function dzDrop(e, target) {
  e.preventDefault(); e.stopPropagation(); e.currentTarget.classList.remove('over');
  if (target === 'bank') addBankFiles(e.dataTransfer.files); else addFiles(e.dataTransfer.files);
}
// 드롭 영역 밖에 놓아도 브라우저가 파일을 열어 버리지 않게 막고, PCB 검사 화면에서는 어디에 놓아도 대기열에 추가한다.
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => { e.preventDefault(); if (S.user && U.route === 'inspect' && e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });

/** 대기열에서 이미지 한 장을 뺀다. @param {number} uid 항목 번호 */
function queueRemove(uid) { if (U.running) return; U.queue = U.queue.filter(q => q.uid !== uid); render(); }
/** 대기열을 모두 비운다(검사 결과 기록은 이력에 남는다). */
function queueClear() { if (U.running) return; U.queue = []; render(); }
/** 검사가 끝난 항목만 목록에서 치운다. */
function queueClearDone() { if (U.running) return; U.queue = U.queue.filter(q => q.st !== 'done'); render(); }

/**
 * 외부 PatchCore API 응답을 모사해 이상 점수를 산출한다 (시연용: 샘플은 순환 값, 업로드 파일은 파일 정보 기반).
 * @param {object} q 대기열 항목
 * @returns {number} 0~1 이상 점수
 */
function mockApiScore(q) {
  const m = SAMPLES[q.key || q.name];
  if (m) { const k = S.demoSeq++; return m[0] === 'A' ? [0.72, 0.88, 0.81, 0.67][k % 4] : [0.21, 0.34, 0.18, 0.27][k % 4]; }   // 샘플 이미지는 정답에 맞춰 점수를 정한다(시안)
  const cycle = [0.72, 0.21, 0.88, 0.34];
  if (q.sample) return cycle[S.demoSeq++ % cycle.length];
  return +(0.12 + ((q.seed || 7) * 37 % 83) / 100).toFixed(2);
}

/** 지정 시간(ms)만큼 기다린다(모션 감소 설정이면 짧게). */
const sleep = ms => new Promise(r => setTimeout(r, REDUCED ? Math.min(ms, 120) : ms));

/**
 * 일괄 검사: 대기 중인 이미지를 순서대로 PatchCore API에 보내고(시뮬레이션) 결과를 검사 이력에 저장한다.
 * AI 이상 → '검토 대기' 큐 편입 / AI 정상 → 정상 자동 확정. 실서비스에서는 같은 POST /api/inspections 를 이미지마다 호출한다.
 * 서버 연결이 끊기면 남은 이미지는 대기 상태로 두고 중단한다. 검사 도중 로그아웃하거나 데모를 초기화하면 이후 이미지는 저장하지 않고 멈춘다.
 */
async function runBatch() {
  if (U.running) return;
  if (!S.api.online) return toast('PatchCore API 서버가 오프라인입니다. 연결 복구 후 다시 시도하세요');
  const todo = U.queue.filter(q => q.st !== 'done');
  if (!todo.length) return toast('검사할 이미지를 추가하세요');
  U.running = true; render();
  const S0 = S, redraw = () => { if (U.route === 'inspect') render(); };   // S0: 도중에 로그아웃·데모 초기화로 상태가 바뀌면 이어서 저장하지 않기 위한 기준
  let ok = 0, anom = 0, stopped = false, aborted = false;
  for (const q of todo) {
    if (S !== S0 || !S.user) { aborted = true; break; }
    if (!S.api.online) { stopped = true; break; }
    q.st = 'run'; redraw(); await sleep(650);
    if (S !== S0 || !S.user) { aborted = true; break; }
    const thr = S.model.threshold, score = mockApiScore(q), last = Math.max(...S.inspections.map(r => r.n)), prevAt = S.inspections.find(r => r.n === last).at;
    const n = last + 1, rng = makeRng((Date.now() + n * 97) % 100000), ai = score >= thr ? 'ANOMALY' : 'NORMAL', bx = boxesOf(q.key || q.name);
    const rec = { n, id: 'INS-' + String(n).padStart(6, '0'), pcb: U.pcb, score, thr, ver: S.model.active, ai, final: ai === 'NORMAL' ? 'NORMAL' : null, memo: '',
      at: prevAt + 120000 + Math.round(rng() * 60000), ms: 380 + Math.round(rng() * 160),
      spot: bx.length ? spotOf(bx) : { x: 20 + Math.round(rng() * 60), y: 22 + Math.round(rng() * 56), r: 10 + Math.round(rng() * 6) }, boxes: bx, img: q.src };
    S.inspections.push(rec); q.rec = rec; q.st = 'done'; ok++; if (ai === 'ANOMALY') anom++;
    redraw();
  }
  for (const q of U.queue) if (q.st === 'run') q.st = 'wait';
  U.running = false;
  if (aborted) { if (S.user) render(); return; }   // 로그아웃·데모 초기화로 중단: 새 상태에는 아무것도 저장하지 않는다
  U.fresh = true; render();
  toast(stopped ? `서버 연결이 끊겨 ${ok}장까지 검사하고 중단했습니다` : `${ok}장 검사 완료 · 정상 ${ok - anom} · 이상 의심 ${anom}${anom ? ' — 검토 대기로 등록' : ''}`);
}

/**
 * PCB 검사 화면을 생성한다.
 * @returns {string} 본문 HTML
 */
function viewInspect() {
  const q = U.queue, off = !S.api.online, total = q.length, done = q.filter(x => x.st === 'done'), waiting = total - done.length;
  const anom = done.filter(x => x.rec.ai === 'ANOMALY'), pct = total ? Math.round(done.length / total * 100) : 0;
  const lastRec = done.length ? done[done.length - 1].rec : null;
  const req = JSON.stringify({ image: '<base64 PCB 이미지>', pcb_id: U.pcb, model: 'industrial-patchcore', version: S.model.active }, null, 2);
  const res = lastRec ? JSON.stringify({ anomaly_score: lastRec.score, threshold: lastRec.thr, is_anomaly: lastRec.ai === 'ANOMALY', elapsed_ms: lastRec.ms }, null, 2) : '(검사 시작 후 표시)';
  const row = x => {
    const r = x.rec;
    const state = x.st === 'run' ? `<span class="pill lg"><span class="spin"></span>분석 중</span>`
      : x.st === 'done' ? `<span class="sc">${r.score.toFixed(2)}<i class="${r.score >= r.thr ? 'hi' : ''}"><b style="width:${Math.round(r.score * 100)}%"></b></i></span><span class="pill ${r.ai === 'ANOMALY' ? 'orange' : 'green'}">${r.ai === 'ANOMALY' ? '이상 의심' : '정상'}</span>`
      : `<span class="pill">대기</span>`;
    const act = x.st === 'done' ? `${r.ai === 'ANOMALY' ? `<button class="btn sm outline" onclick="openReview(${r.n})">판정하기</button>` : ''}`
      : `<button class="icon-btn" ${U.running ? 'disabled' : ''} onclick="queueRemove(${x.uid})" aria-label="목록에서 빼기" title="목록에서 빼기">${ic('x')}</button>`;
    return `<div class="qrow ${x.st}" data-st="${x.st}"><div class="photo ${x.st === 'run' ? 'scanning' : ''}" onclick="${x.st === 'done' ? `openViewer(${r.n})` : `openQueueImg(${x.uid})`}" title="클릭하면 크게 볼 수 있습니다"><img src="${x.src}" alt="${esc(x.name)}">${x.st === 'done' ? markerHtml(r, true) : ''}</div>
      <div class="qinfo"><b class="qname" title="${esc(x.name)}">${esc(x.name)}</b><div class="small muted">${x.sample ? '샘플 이미지' : fmtBytes(x.size)}${x.st === 'done' ? ` · ${r.id} · ${r.ms}ms` : ''}</div>${x.st === 'done' && r.ai === 'ANOMALY' ? `<div class="small" style="color:#ef4444;font-weight:600">의심 영역 ${(r.boxes && r.boxes.length) || 1}곳 — 썸네일의 빨간 박스 (클릭하면 크게 확인)</div>` : ''}</div>
      <div class="qres">${state}</div><div class="qact">${act}</div></div>`;
  };
  return `${pageHead('PCB 외관 검사', 'PCB 종류 선택 → 사진 여러 장 올리기 → 한 번에 검사')}
    ${off ? `<div class="banner-off">${ic('lock', 'lg')}<span>PatchCore API 서버 오프라인 — 검사를 시작할 수 없습니다. 상단의 상태 배지를 눌러 연결을 확인하세요.</span></div>` : ''}
    <div class="row mb14">
      <span class="ptype-lbl" title="검사할 제품(기판)의 이름입니다">${ic('chip')}PCB 종류</span>
      <select class="inp" style="width:auto" aria-label="PCB 종류" ${U.running ? 'disabled' : ''} onchange="U.pcb=this.value;render()">${S.pcbs.filter(p => p.status === '검사 가능').map(p => `<option ${p.id === U.pcb ? 'selected' : ''}>${esc(p.id)}</option>`).join('')}</select>
      <span class="pill">일반 검사</span><span class="pill green">모델 준비 완료</span><span class="small muted">선택한 종류로 아래 모든 이미지를 검사합니다</span>
    </div>
    <div class="card"><div class="card-title">검사 이미지 <span class="pill">${total}장</span><span class="sp"></span><button class="btn sm outline" ${U.running || !total ? 'disabled' : ''} onclick="queueClear()">목록 비우기</button></div>
      <div class="drop dz" role="button" tabindex="0" ${U.running ? '' : 'onclick="pickFile()" onkeydown="if(event.key===\'Enter\')pickFile()"'} ondragover="dzOver(event)" ondragleave="dzLeave(event)" ondrop="dzDrop(event,'queue')">
        ${ic('upload', 'lg')}<div class="mt6"><b>PCB 사진을 여기로 끌어다 놓으세요</b></div><div class="small dz-note">또는 클릭해서 파일 선택 — <b>여러 장 동시 선택 가능</b> · 최대 ${MAX_BATCH}장 · PNG · JPG · BMP · WebP</div></div>
      <div class="grid2 mt10"><button class="btn" ${U.running ? 'disabled' : ''} onclick="pickFile()">${ic('upload')}파일 선택 (여러 장)</button><button class="btn" ${U.running ? 'disabled' : ''} onclick="capture()">${ic('camera')}촬영 추가</button></div>
      <div class="row mt8"><button class="btn sm outline" ${U.running ? 'disabled' : ''} onclick="loadSampleSet()">${ic('chip')}샘플 세트 불러오기 (10장)</button><span class="small muted">공개 PCB 사진(정상 기판 4장 + 불량 6종) — 정상·불량이 섞여 있어 의심 영역 표시를 바로 볼 수 있습니다</span></div></div>
    <div class="card"><div class="card-title">검사 목록 · 결과<span class="sp"></span>${done.length && !U.running ? `<button class="btn sm outline" onclick="queueClearDone()">완료 항목 치우기</button>` : ''}</div>
      ${total ? `<div class="qsum"><div class="bar-track"><div class="bar-fill ok" style="width:${pct}%"></div></div><b>${done.length} / ${total}</b><span class="pill green">정상 ${done.length - anom.length}</span><span class="pill orange">이상 의심 ${anom.length}</span>${anom.length && !U.running ? `<button class="btn sm primary" onclick="openReview(${anom[0].rec.n})">이상 의심 건 판정하기</button>` : ''}</div>
        <div class="qlist">${q.map(row).join('')}</div>` : `<div class="empty">${ic('upload')}검사할 이미지가 없습니다.<br>위 영역에 사진을 끌어다 놓거나 파일을 선택하세요.</div>`}</div>
    <button class="btn primary block mt14" onclick="runBatch()" ${U.running || off || !waiting ? 'disabled' : ''}>${U.running ? '<span class="spin"></span>PatchCore API 호출 중…' : off ? 'API 오프라인 — 검사 불가' : waiting ? `검사 시작 (${waiting}장)` : total ? '모든 이미지를 검사했습니다' : '검사할 이미지를 추가하세요'}</button>
    <p class="note">여러 장을 올리면 순서대로 한 장씩 PatchCore API에 보내 한 번에 검사합니다. 이상 의심 건은 검사 관리의 검토 대기로 들어가고, 정상은 자동 확정됩니다. 이상 의심 건은 이미지에 빨간 박스로 의심 영역이 표시됩니다 (샘플 이미지는 데이터셋 정답 위치, 그 외 파일은 시연용 위치 · 실제 영역 좌표는 API 연동 시 제공, Heatmap은 확장 단계). 샘플 이미지 출처: PCB-DSLR(TU Wien, CC BY 4.0) · Roboflow pcb_component_detection_2(CC BY 4.0) · PKU-Market-PCB(베이징대, 합성 불량·라이선스 확인 필요).</p>
    ${isAdmin() ? `<div class="card mt14"><details><summary>외부 PatchCore API 호출 계약(안) 보기 <span class="pill role-admin">관리자 전용</span></summary>
      <div class="note" style="margin:6px 0 8px">자체 모델 구현 없이 공개 Industrial PatchCore API를 호출만 합니다. 이미지마다 한 번씩 호출합니다. 아래는 어댑터가 사용할 요청·응답 계약(안)입니다.</div>
      <div class="grid2"><div><div class="small muted">요청</div><div class="code">${esc(req)}</div></div><div><div class="small muted">응답</div><div class="code">${esc(res)}</div></div></div></details></div>` : ''}`;
}

/**
 * 검사 전 대기열 이미지를 확대 뷰어로 크게 본다(검사 기록이 없는 이미지용 단순 뷰어).
 * @param {number} uid 대기열 항목 번호
 */
function openQueueImg(uid) {
  const x = U.queue.find(v => v.uid === uid); if (!x) return;
  openModal(`<div class="row between mb8"><b style="font-size:18px">${esc(x.name)}</b><button class="icon-btn" onclick="closeModal()" aria-label="닫기">${ic('x')}</button></div>
    <div class="photo"><img src="${x.src}" alt="${esc(x.name)}"></div><div class="note">검사 전 이미지입니다. 검사가 끝나면 확대 · 다운로드 · 판정이 가능합니다.</div>`);
}

/* ═══════════════════════════════════════════════════════════════════════════
   6-2. PCB 종류별 데이터뱅크 (데이터 관리 메뉴) — 정상 기준 이미지 · Memory Bank 파일 업로드 (시연: 브라우저 메모리에만 보관)
   ═══════════════════════════════════════════════════════════════════════════ */
/** 선택한 PCB 종류의 데이터뱅크 파일 목록을 돌려준다(없으면 빈 배열). @param {string} id PCB 종류 이름 */
const bankOf = id => S.banks[id] || (S.banks[id] = []);

/** 데이터뱅크 대상 PCB 종류를 바꾼다. @param {string} id PCB 종류 이름 */
function setBankPcb(id) { U.bankPcb = id; render(); }

/**
 * 데이터뱅크에 파일 여러 개를 올린다. 이미지는 '정상 이미지', 그 밖의 파일(.zip · .npy · .pt …)은 'Memory Bank 파일'로 분류한다.
 * 시연에서는 파일을 서버로 보내지 않고 브라우저 메모리에만 보관한다(새로고침하면 사라짐).
 * @param {FileList|File[]} files 선택하거나 끌어다 놓은 파일들
 */
function addBankFiles(files) {
  if (!isAdmin()) return toast('데이터뱅크 업로드는 관리자만 할 수 있습니다');
  const arr = bankOf(U.bankPcb), list = [...files]; if (!list.length) return;
  const room = Math.max(0, 200 - arr.length), take = list.slice(0, room);
  take.forEach(f => {
    const img = /^image\//.test(f.type) || /\.(png|jpe?g|bmp|webp)$/i.test(f.name);
    arr.push({ id: Date.now() + '-' + arr.length + Math.random().toString(36).slice(2, 5), name: f.name, size: f.size, kind: img ? 'image' : 'bank', at: Date.now(), src: img ? URL.createObjectURL(f) : '' });
  });
  render(); toast(`${take.length}개를 ${U.bankPcb} 데이터뱅크에 추가했습니다 (시연: 브라우저 메모리)` + (list.length > take.length ? ` · 200개 초과 ${list.length - take.length}개 제외` : ''));
}
document.getElementById('bankInput').addEventListener('change', e => { const a = [...e.target.files]; e.target.value = ''; addBankFiles(a); });

/** 데이터뱅크 파일을 하나 지운다. @param {string} id PCB 종류 @param {string} fid 파일 id */
function bankDelete(id, fid) {
  if (!isAdmin()) return;
  const arr = bankOf(id), f = arr.find(x => x.id === fid); if (!f) return;
  if (f.src) URL.revokeObjectURL(f.src);
  S.banks[id] = arr.filter(x => x.id !== fid); render(); toast(`${f.name} 삭제`);
}

/**
 * 데이터 관리 화면의 'PCB 종류별 데이터뱅크' 카드를 생성한다.
 * 종류별 요약 표 + 선택한 종류의 업로드 영역(관리자) · 파일 목록. 실서비스에서는 서버 저장소와 pcb_banks 테이블을 사용하고,
 * 학습 연결(Custom PatchCore)은 후속 확장이다.
 * @param {boolean} adm 관리자 여부
 * @returns {string} HTML
 */
function bankCardHtml(adm) {
  if (!S.pcbs.some(p => p.id === U.bankPcb)) U.bankPcb = S.pcbs[0].id;
  const cur = U.bankPcb, files = S.banks[cur] || [], imgs = files.filter(f => f.kind === 'image').length, banks = files.length - imgs;
  const sum = S.pcbs.map(p => { const a = S.banks[p.id] || [], im = a.filter(f => f.kind === 'image').length;
    return `<tr class="click ${p.id === cur ? 'sel' : ''}" data-pcb="${esc(p.id)}" onclick="setBankPcb(this.dataset.pcb)"><td>${pcbTag(p.id)}</td><td>공개 Memory Bank ${S.model.active} <span class="muted small">(Industrial PatchCore)</span></td><td>${im}장</td><td>${a.length - im}개</td><td>${a.length ? '<span class="pill orange">자체 데이터 있음 · 학습 연결 예정</span>' : '<span class="pill green">공개 뱅크 사용 중</span>'}</td></tr>`; }).join('');
  const kindPill = f => f.kind === 'image' ? '<span class="pill green">정상 이미지</span>' : '<span class="pill">Memory Bank 파일</span>';
  const upload = adm ? `<div class="drop dz" role="button" tabindex="0" onclick="document.getElementById('bankInput').click()" onkeydown="if(event.key==='Enter')document.getElementById('bankInput').click()" ondragover="dzOver(event)" ondragleave="dzLeave(event)" ondrop="dzDrop(event,'bank')">${ic('upload', 'lg')}<div class="mt6"><b>${esc(cur)} 데이터뱅크 파일을 끌어다 놓거나 클릭해서 선택</b></div><div class="small dz-note">정상 PCB 사진(PNG · JPG …) 또는 Memory Bank 파일(.zip · .npy · .pt · .pth · .ckpt · .faiss · .pkl · .bin · .json) · 여러 개 동시 선택 가능</div></div>`
    : `<div class="mode-note">${ic('lock', 'lg')}<span><b>조회 전용</b> — 데이터뱅크 업로드·삭제는 관리자만 할 수 있습니다.</span></div>`;
  return `<div class="card"><div class="card-title">${ic('db', 'lg')}PCB 종류별 데이터뱅크<span class="pill">시연</span></div>
      <div class="muted small mb10">PCB 종류마다 <b>정상 기준 이미지</b>나 <b>Memory Bank 파일</b>을 모아 두는 곳입니다. 지금의 검사는 외부 PatchCore API의 공개 Memory Bank를 사용하며, 여기에 올린 자체 데이터는 이후 자체 모델(Custom PatchCore) 학습·기준 데이터로 연결할 예정입니다.</div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>PCB 종류</th><th>현재 적용 기준</th><th>정상 이미지</th><th>뱅크 파일</th><th>상태</th></tr></thead><tbody>${sum}</tbody></table></div>
      <div class="divider"></div>
      <div class="row mb10"><b>${pcbTag(cur)} 데이터뱅크</b><span class="muted small">정상 이미지 ${imgs}장 · 뱅크 파일 ${banks}개</span><span class="sp"></span>
        <select class="inp" style="width:auto" aria-label="데이터뱅크 PCB 종류" onchange="setBankPcb(this.value)">${S.pcbs.map(p => `<option ${p.id === cur ? 'selected' : ''}>${esc(p.id)}</option>`).join('')}</select></div>
      ${upload}
      <div class="bk-list mt10">${files.length ? files.map(f => `<div class="bk-row"><div class="bk-ico">${f.src ? `<img src="${f.src}" alt="">` : ic('db')}</div><div style="flex:1;min-width:0"><b class="qname" title="${esc(f.name)}">${esc(f.name)}</b><div class="small muted">${fmtBytes(f.size)} · ${mdhm(f.at)}</div></div>${kindPill(f)}${adm ? `<button class="icon-btn" data-pcb="${esc(cur)}" data-fid="${f.id}" onclick="bankDelete(this.dataset.pcb,this.dataset.fid)" aria-label="삭제" title="삭제">${ic('x')}</button>` : ''}</div>`).join('') : `<div class="empty">${esc(cur)}에 올린 자체 데이터뱅크 파일이 없습니다.<br>공개 Memory Bank(${S.model.active})를 사용 중입니다.</div>`}</div>
      <div class="note">시연에서는 파일을 서버로 보내지 않고 브라우저 메모리에만 보관합니다(새로고침하면 사라짐). 실서비스는 서버 스토리지(/storage/banks/{PCB 종류}/)에 저장하고 pcb_banks 테이블에 기록합니다. 학습 연결은 후속 확장(자체 Memory Bank)입니다.</div></div>`;
}

// 시작 시 검사 대기열에 샘플 이미지 1장을 넣어 두어, 바로 '검사 시작'을 눌러 볼 수 있게 한다.
U.queue.push(newQueueItem({ ...sampleItem(SAMPLE_NORM[0]), name: '샘플 촬영 이미지' }));

/* ═══════════════════════════════════════════════════════════════════════════
   7. [메뉴 3] 검사 관리 — 검사원 최종 판정 · 판정 사유 · 피드백 + (관리자) AI 판단 근거
   ═══════════════════════════════════════════════════════════════════════════ */
/**
 * 검사 관리 화면으로 이동해 특정 검사를 선택한다.
 * @param {number} n 검사 번호
 */
function openReview(n) { closeModal(); U.rvSel = n; U.rvMemo = ''; U.evMode = 'orig'; U.rvFilter = 'all'; U.rvQ = ''; go('review'); }

/**
 * 이상 의심 영역 박스를 만든다(모든 역할 공통). 위치는 시연용 시뮬레이션이며, 실서비스에서는 PatchCore 응답의 영역 좌표를 쓴다.
 * 이미지 박스(position:relative) 안에 넣어 쓰며, 정상 판정이면 빈 문자열이다.
 * @param {object} r 검사 레코드
 * @param {boolean} [small] true면 라벨 없이 얇은 박스(썸네일용)
 * @returns {string} 박스 HTML
 */
function markerHtml(r, small) {
  if (!r || r.ai !== 'ANOMALY') return '';
  let bs = r.boxes && r.boxes.length ? r.boxes : (r.spot ? [{ x: r.spot.x - r.spot.r * 1.1, y: r.spot.y - r.spot.r * 1.45, w: r.spot.r * 2.2, h: r.spot.r * 2.9 }] : []);
  return bs.map((q, i) => {
    const w = Math.min(100, Math.max(q.w + 2.4, 5)), h = Math.min(100, Math.max(q.h + 2.4, 5));
    const l = Math.max(0, Math.min(100 - w, q.x + q.w / 2 - w / 2)), t = Math.max(0, Math.min(100 - h, q.y + q.h / 2 - h / 2));
    const lab = i || small ? '' : `<i${t < 12 ? ' style="bottom:auto;top:100%;margin:2px 0 0"' : ''}>의심 영역 · ${r.score.toFixed(2)}${bs.length > 1 ? ` 외 ${bs.length - 1}곳` : ''}</i>`;
    return `<div class="mk ${small ? 'sm' : ''}" style="left:${l}%;top:${t}%;width:${w}%;height:${h}%">${lab}</div>`;
  }).join('');
}

/** 의심 영역 표시 켜기/끄기 버튼(검사 관리·확대 뷰어). */
function markBtn() { return `<button class="btn sm outline mk-btn ${U.mkOff ? 'off' : ''}" onclick="toggleMark()" aria-pressed="${!U.mkOff}" title="이미지 위 이상 의심 영역 박스를 켜고 끕니다"><span class="mk-dot"></span>의심 영역 표시 ${U.mkOff ? '꺼짐' : '켜짐'}</button>`; }

/** 의심 영역 표시를 켜고 끈다(화면 전체에 적용). */
function toggleMark() {
  U.mkOff = !U.mkOff; document.body.classList.toggle('mk-off', !!U.mkOff);
  document.querySelectorAll('.mk-btn').forEach(b => { b.classList.toggle('off', !!U.mkOff); b.setAttribute('aria-pressed', String(!U.mkOff)); b.lastChild.textContent = '의심 영역 표시 ' + (U.mkOff ? '꺼짐' : '켜짐'); });
}

/**
 * AI 판단 근거 오버레이(Heatmap · Mask · Overlay)를 생성한다 — 관리자 전용 시뮬레이션.
 * @param {object} r 검사 레코드
 * @param {string} mode 'orig' | 'heat' | 'mask' | 'overlay'
 * @param {number} op 불투명도(0~100)
 * @returns {string} 오버레이 HTML (이미지 박스 내부에 삽입)
 */
function evidenceLayer(r, mode, op) {
  if (r.ai !== 'ANOMALY' || mode === 'orig') return '';
  const { x, y, r: rad } = r.spot, a = (op / 100).toFixed(2);
  if (mode === 'heat') return `<div class="ov" style="opacity:${a};background:radial-gradient(circle at ${x}% ${y}%, rgba(239,68,68,.95) 0, rgba(249,115,22,.75) ${rad * .45}%, rgba(234,179,8,.4) ${rad * .8}%, rgba(34,197,94,0) ${rad * 1.3}%)"></div>`;
  if (mode === 'mask') return `<div class="ov" style="background:#000"></div><div class="ov" style="background:radial-gradient(ellipse ${rad}% ${rad * 1.3}% at ${x}% ${y}%, #fff 0, #fff 92%, #000 100%)"></div>`;
  return `<div class="ov" style="opacity:${a};background:radial-gradient(ellipse ${rad}% ${rad * 1.3}% at ${x}% ${y}%, rgba(239,68,68,.5) 0, rgba(239,68,68,.5) 90%, rgba(239,68,68,0) 100%)"></div>
    <div class="ov" style="opacity:${a}"><div style="position:absolute;left:${x - rad * 1.1}%;top:${y - rad * 1.45}%;width:${rad * 2.2}%;height:${rad * 2.9}%;border:2px solid #ef4444;border-radius:4px"></div></div>`;
}

/** 검사 관리 목록의 상태 필터: 전체 · 검토 대기 · 검토 완료 · (최종) 정상 · (최종) 불량. */
const RV_FILTERS = { all: () => true, pending: r => r.final === null, done: r => r.final !== null, normal: r => r.final === 'NORMAL', defect: r => r.final === 'DEFECT' };

/**
 * 검색어가 검사 레코드와 맞는지 본다 — 검사 ID(INS-000120) · 번호(120) · 판정 사유 메모를 대소문자 구분 없이 부분 일치로 찾는다.
 * @param {object} r 검사 레코드
 * @param {string} q 검색어(빈 값이면 모두 일치)
 * @returns {boolean} 일치 여부
 */
function rvMatch(r, q) {
  const s = (q || '').trim().toLowerCase(); if (!s) return true;
  const num = s.replace(/^ins-?/, '').replace(/^0+(?=\d)/, '');
  return r.id.toLowerCase().includes(s) || (/^\d+$/.test(num) && String(r.n).includes(num)) || (r.memo || '').toLowerCase().includes(s);
}

/** 상태 필터 칩 HTML. 칩의 건수는 현재 검색어를 적용한 결과 기준이다. */
function rvChipsHtml() {
  const base = S.inspections.filter(r => rvMatch(r, U.rvQ)), cnt = id => base.filter(RV_FILTERS[id]).length;
  const chip = (id, label, cls) => `<button class="pill ${U.rvFilter === id ? 'active' : cls}" aria-pressed="${U.rvFilter === id}" onclick="U.rvFilter='${id}';render()">${label} <b>${cnt(id)}</b></button>`;
  return chip('all', '전체', '') + chip('pending', '검토 대기', 'orange') + chip('done', '검토 완료', 'green') + '<span class="rv-sep"></span>' + chip('normal', '정상', 'green') + chip('defect', '불량', 'red');
}

/** 목록 위의 결과 건수 문구. @param {number} total 조건에 맞는 전체 건수 @param {number} shown 화면에 보이는 건수(최대 60) */
function rvCountHtml(total, shown) {
  const q = (U.rvQ || '').trim();
  return `${q ? `‘${esc(q)}’ 검색 결과 ` : ''}<b>${total}</b>건${total > shown ? ` · 상위 ${shown}건만 표시 — 검색어를 더 구체적으로 입력하세요` : ''}`;
}

/**
 * 검색어를 바꾼다. 입력 중에는 화면 전체를 다시 그리지 않고 칩 · 건수 · 목록 · 상세만 갈아 끼워 입력 커서와 한글 조합이 끊기지 않게 한다.
 * @param {string} q 검색어
 * @param {boolean} [full] true면 화면 전체를 다시 그린다(지우기 버튼)
 */
function rvSearch(q, full) {
  U.rvQ = q; const prev = U.rvSel;
  if (full || !document.getElementById('rvCard')) { render(); const el = document.getElementById('rvSearch'); if (el) el.focus(); return; }
  const t = document.createElement('div'); t.innerHTML = viewReview();
  if (U.rvSel !== prev) { U.rvMemo = ''; U.evMode = 'orig'; t.innerHTML = viewReview(); }   // 선택 건이 바뀌면 작성 중이던 메모·근거 모드 초기화
  ['rvChips', 'rvCount', 'rvList', 'rvCard'].forEach(id => { const n = document.getElementById(id), s = t.querySelector('#' + id); if (n && s) n.innerHTML = s.innerHTML; });
}

/** 검색창에서 Enter: 목록의 첫 번째 검사를 선택한다. */
function rvFirst() { const el = document.querySelector('#rvList .rv-item'); if (el) el.click(); }

/** 검색어와 상태 필터를 모두 초기화한다. */
function rvReset() { U.rvQ = ''; U.rvFilter = 'all'; render(); }

/**
 * 검사 관리 화면을 생성한다.
 * @returns {string} 본문 HTML
 */
function viewReview() {
  const st = getStats();
  const hits = S.inspections.filter(r => (RV_FILTERS[U.rvFilter] || RV_FILTERS.all)(r) && rvMatch(r, U.rvQ)).sort((a, b) => (a.final === null ? 0 : 1) - (b.final === null ? 0 : 1) || b.n - a.n);
  const list = hits.slice(0, 60);
  if (!list.find(r => r.n === U.rvSel)) U.rvSel = list.length ? list[0].n : null;
  const cur = S.inspections.find(r => r.n === U.rvSel);
  let detail = '<div class="empty">검토할 항목이 없습니다.</div>';
  if (cur) {
    const f = finalState(cur);
    const modes = [['orig', '원본'], ['heat', 'Heatmap'], ['mask', 'Mask'], ['overlay', 'Overlay']];
    const evidence = isAdmin() ? `
      <div class="card-title mt16">AI 판단 근거 <span class="pill">관리자 전용</span></div>
      <div class="row mb8">${modes.map(([k, l]) => `<button class="pill ${U.evMode === k ? 'active' : ''}" onclick="U.evMode='${k}';render()">${l}</button>`).join('')}
        <label class="small muted" style="margin-left:auto">투명도 <input type="range" min="20" max="100" value="${U.evOpacity}" oninput="U.evOpacity=+this.value;document.getElementById('evLayer').innerHTML=evidenceLayer(S.inspections.find(r=>r.n===U.rvSel),U.evMode,U.evOpacity)"></label></div>
      <div class="photo zoomable" title="클릭하면 크게 볼 수 있습니다(선택한 판단 근거 포함)" onclick="openViewer(${cur.n})"><img src="${cur.img}" alt="AI 판단 근거 원본" style="${U.evMode === 'mask' && cur.ai === 'ANOMALY' ? 'visibility:hidden' : ''}"><div id="evLayer">${evidenceLayer(cur, U.evMode, U.evOpacity)}</div>${U.evMode === 'orig' ? markerHtml(cur) : ''}<span class="zoom-hint">${ic('zoom')}확대</span></div>
      <div class="note">${cur.ai === 'ANOMALY' ? 'AI가 어떤 영역을 근거로 이상으로 판단했는지 보여주는 자료입니다 (시안: 샘플 이미지는 데이터셋 정답 위치, 그 외는 시뮬레이션).' : 'AI 정상 판정 — 표시할 이상 영역이 없습니다.'} 실제 Heatmap · Mask · Overlay는 API 확장 이후 연동됩니다.</div>`
      : `<div class="locked mt16">${ic('lock', 'lg')}<div><b>AI 판단 근거(Heatmap · Mask · Overlay)</b><br>관리자 전용 화면에서 제공됩니다. 검사원은 점수와 원본 이미지로 판정합니다.</div></div>`;
    detail = `
      <div class="row" style="align-items:flex-start;flex-wrap:nowrap;gap:16px">
        <div style="width:46%;min-width:0"><div class="photo zoomable" role="button" tabindex="0" title="클릭하면 크게 볼 수 있습니다" onclick="openViewer(${cur.n})" onkeydown="if(event.key==='Enter')openViewer(${cur.n})"><img src="${cur.img}" alt="${cur.id} 원본">${markerHtml(cur)}<span class="zoom-hint">${ic('zoom')}확대</span></div>
          <div class="row mt8"><button class="btn sm" onclick="openViewer(${cur.n})">${ic('zoom')}확대 보기</button><button class="btn sm outline" onclick="downloadImage(${cur.n})">${ic('download')}다운로드</button>${cur.ai === 'ANOMALY' ? markBtn() : ''}</div>
          ${cur.ai === 'ANOMALY' ? `<div class="small mt6" style="color:#ef4444">빨간 박스: AI가 이상으로 의심한 영역${cur.boxes && cur.boxes.length && cur.boxes[0].k ? ` · 데이터셋 정답 유형(참고): ${KIND_KO[cur.boxes[0].k] || cur.boxes[0].k}${cur.boxes.length > 1 ? ' 외' : ''}` : ' (시연용 위치)'}</div>` : ''}</div>
        <div style="flex:1;min-width:0"><div style="font-size:20px;font-weight:800">${cur.id}</div>
          <div class="muted" style="margin:2px 0 8px">PCB 종류 ${pcbTag(cur.pcb)} · Industrial PatchCore ${cur.ver}</div>
          <span class="pill ${cur.ai === 'ANOMALY' ? 'orange' : 'green'}">${cur.ai === 'ANOMALY' ? 'AI 이상 의심' : 'AI 정상'}</span>
          <div class="mt10">이상 점수: <b>${cur.score.toFixed(2)}</b></div><div>임계값: <b>${cur.thr.toFixed(2)}</b> <span class="muted small">(검사 당시)</span></div>
          <div class="note">현재 상태: ${finalBadge(cur)}</div></div></div>
      <div class="divider"></div>
      <div style="font-weight:700;margin-bottom:8px">검사원 최종 판정</div>
      <div class="grid2"><button class="btn primary block" style="font-size:15px;padding:12px" onclick="submitReview(${cur.n},'NORMAL')">정상</button><button class="btn danger block" style="font-size:15px;padding:12px" onclick="submitReview(${cur.n},'DEFECT')">불량</button></div>
      <div class="field mt12"><label>판정 사유 및 검사원 메모</label>
        <textarea class="inp" id="rvMemo" placeholder="판정 사유를 입력하는 영역 (정상 확정 시 가불량 사유, 불량 확정 시 불량 내용)" oninput="U.rvMemo=this.value">${esc(U.rvMemo || cur.memo)}</textarea></div>
      <div class="note">${f === 'PENDING' ? '' : '이미 확정된 건입니다. 다시 누르면 최종 판정을 변경하며, AI 최초 판정은 그대로 보존됩니다. '}확정 판정과 사유는 피드백 데이터로 누적되어 추후 자체 모델(Custom PatchCore) 학습에 활용됩니다.</div>
      ${evidence}`;
  }
  return `${pageHead('검사 관리', '이상 의심 건 확인 · 최종 판정 · 사유 기록', `<span class="pill orange lg">${st.pending}건 대기</span>`)}
    <div class="rv-tools"><div class="rv-search"><input class="inp" id="rvSearch" type="text" autocomplete="off" placeholder="검사 ID · 번호 · 메모 검색 (예: INS-000120, 120)" aria-label="검사 검색" value="${esc(U.rvQ)}" oninput="rvSearch(this.value)" onkeydown="if(event.key==='Enter')rvFirst()"><button class="icon-btn x" onclick="rvSearch('', true)" aria-label="검색어 지우기" title="검색어 지우기">${ic('x')}</button></div><div class="rv-chips" id="rvChips">${rvChipsHtml()}</div></div>
    <div class="split rv">
      <div><div class="small muted rv-count" id="rvCount">${rvCountHtml(hits.length, list.length)}</div><div class="rv-list" id="rvList">${list.map(r => `<button class="rv-item ${r.n === U.rvSel ? 'sel' : ''}" onclick="U.rvSel=${r.n};U.rvMemo='';U.evMode='orig';render()"><div class="thumb" style="${thumbStyle(r)}"></div><div style="flex:1;min-width:0"><div class="rv-h"><span class="t">${r.id}</span>${finalBadge(r)}</div><div class="small muted">${pcbTag(r.pcb)} · 점수 <b>${r.score.toFixed(2)}</b> · ${hhmm(r.at)}</div></div></button>`).join('') || '<div class="empty">조건에 맞는 검사가 없습니다.<br><button class="btn sm outline mt10" onclick="rvReset()">검색·필터 초기화</button></div>'}</div></div>
      <div class="card" id="rvCard">${detail}</div></div>`;
}

/**
 * 검사원 최종 판정을 저장한다. AI 최초 판정(ai·score)은 변경하지 않고 final·memo만 기록한다.
 * @param {number} n 검사 번호
 * @param {'NORMAL'|'DEFECT'} decision 최종 판정
 */
function submitReview(n, decision) {
  const r = S.inspections.find(x => x.n === n); if (!r) return;
  const memo = (document.getElementById('rvMemo') || { value: '' }).value.trim();
  const wasPending = r.final === null; r.final = decision; r.memo = memo; U.rvMemo = '';
  const rescue = r.ai === 'ANOMALY' && decision === 'NORMAL';
  toast(`${r.id} ${decision === 'NORMAL' ? '정상' : '불량'} 확정${rescue ? ' (가불량 구제)' : ''}${decision === 'DEFECT' && !memo ? ' · 사유 미입력' : ''}`);
  if (wasPending) { const next = S.inspections.filter(x => x.final === null).sort((a, b) => b.n - a.n)[0]; U.rvSel = next ? next.n : r.n; }
  render();
}

/* ═══════════════════════════════════════════════════════════════════════════
   8. [메뉴 4] 검사 이력 — 결과 조회 · 검색 · 이미지 및 CSV 다운로드
   ═══════════════════════════════════════════════════════════════════════════ */
/**
 * 현재 필터(기간·PCB·결과·검색어)에 맞는 검사 목록을 반환한다.
 * @returns {object[]} 번호 내림차순 검사 레코드
 */
function filteredHistory() {
  const f = U.hf;
  return S.inspections.filter(r => {
    const h = new Date(r.at).getHours();
    if (f.period === 'am' && h >= 12) return false;
    if (f.period === 'pm' && (h < 12 || h >= 18)) return false;
    if (f.period === 'eve' && h < 18) return false;
    if (f.hour != null && h !== f.hour) return false;
    if (f.pcb !== 'all' && r.pcb !== f.pcb) return false;
    if (f.result !== 'all' && finalState(r) !== f.result) return false;
    if (f.q && !(r.id.toLowerCase().includes(f.q.toLowerCase()) || String(r.n) === f.q.trim())) return false;
    return true;
  }).sort((a, b) => b.n - a.n);
}

/**
 * 검사 이력 화면을 생성한다 (10건 단위 페이징).
 * @returns {string} 본문 HTML
 */
function viewHistory() {
  const all = filteredHistory(), per = 10, pages = Math.max(1, Math.ceil(all.length / per));
  U.hpage = Math.min(U.hpage, pages); const rows = all.slice((U.hpage - 1) * per, U.hpage * per);
  const sel = (key, opts) => `<select class="inp" style="width:auto" onchange="U.hf.${key}=this.value;U.hpage=1;render()">${opts.map(([v, l]) => `<option value="${v}" ${U.hf[key] === v ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
  return `${pageHead('검사 이력', '결과 조회 · 검색 · 이미지 및 CSV 다운로드')}
    <div class="card"><div class="row mb12">
      ${sel('period', [['all', '기간: 전체'], ['am', '기간: 오전'], ['pm', '기간: 오후'], ['eve', '기간: 저녁']])}
      ${sel('pcb', [['all', 'PCB 종류: 전체'], ...S.pcbs.map(p => [p.id, 'PCB 종류: ' + p.id])])}
      ${sel('result', [['all', '결과: 전체'], ['NORMAL', '결과: 정상'], ['DEFECT', '결과: 불량'], ['PENDING', '결과: 검토 대기']])}
      <input class="inp" style="width:170px" placeholder="검사 ID · 번호 검색" value="${esc(U.hf.q)}" onchange="U.hf.q=this.value;U.hpage=1;render()">
      ${U.hf.hour != null ? `<button class="pill" onclick="U.hf.hour=null;U.hpage=1;render()" title="시간 필터 해제">${U.hf.hour}시대 ✕</button>` : ''}<span class="muted small">${all.length}건</span><button class="btn sm outline" style="margin-left:auto" onclick="exportCsv()">${ic('download')}CSV 다운로드</button></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>번호</th><th>PCB 종류</th><th>AI 점수</th><th>AI 판정</th><th>최종 판정</th><th>검사 시각</th>${isAdmin() ? '<th>당시 임계값</th><th>모델</th>' : ''}</tr></thead><tbody>
      ${rows.map(r => `<tr class="click ${r.ai === 'ANOMALY' ? 'anom' : ''}" onclick="openDetail(${r.n})"><td>${r.n}</td><td>${pcbTag(r.pcb)}</td><td><span class="sc">${r.score.toFixed(2)}<i class="${r.score >= r.thr ? 'hi' : ''}"><b style="width:${Math.round(r.score * 100)}%"></b></i></span></td><td>${aiBadge(r.ai)}</td><td>${finalBadge(r)}</td><td>${mdhm(r.at)}</td>${isAdmin() ? `<td>${r.thr.toFixed(2)}</td><td>${r.ver}</td>` : ''}</tr>`).join('') || `<tr><td colspan="${isAdmin() ? 8 : 6}" class="empty">${ic('history')}조건에 맞는 검사가 없습니다.<br><button class="btn sm outline mt10" onclick="U.hf={period:'all',pcb:'all',result:'all',q:''};U.hpage=1;render()">필터 초기화</button></td></tr>`}</tbody></table></div>
      <div class="pager"><button class="btn sm" ${U.hpage <= 1 ? 'disabled' : ''} onclick="U.hpage--;render()">이전</button><span class="small muted">${U.hpage} / ${pages}</span><button class="btn sm" ${U.hpage >= pages ? 'disabled' : ''} onclick="U.hpage++;render()">다음</button></div>
    </div>`;
}

/**
 * 검사 상세 모달을 연다 (검사 당시 임계값·모델 버전 스냅샷 포함).
 * @param {number} n 검사 번호
 */
function openDetail(n) {
  const r = S.inspections.find(x => x.n === n); if (!r) return;
  openModal(`<div class="row between"><b style="font-size:18px">${r.id}</b><button class="icon-btn" onclick="closeModal()" aria-label="닫기">${ic('x')}</button></div>
    <div class="photo zoomable" style="margin:12px 0" title="클릭하면 크게 볼 수 있습니다" onclick="openViewer(${r.n})"><img src="${r.img}" alt="${r.id}">${markerHtml(r)}<span class="zoom-hint">${ic('zoom')}확대</span></div>
    <dl class="kv"><dt>PCB 종류 / 모델</dt><dd>${pcbTag(r.pcb)} · Industrial PatchCore ${r.ver}</dd><dt>검사 시각</dt><dd>${mdhm(r.at)} · 처리 ${r.ms}ms</dd>
      <dt>AI 점수</dt><dd>${r.score.toFixed(2)} (당시 임계값 ${r.thr.toFixed(2)})</dd><dt>AI 판정</dt><dd>${aiBadge(r.ai)}</dd><dt>최종 판정</dt><dd>${finalBadge(r)}</dd><dt>판정 사유</dt><dd>${esc(r.memo) || '<span class="muted">—</span>'}</dd></dl>
    <div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn outline" onclick="downloadImage(${r.n})">${ic('download')}이미지 다운로드</button><button class="btn primary" onclick="openReview(${r.n})">검사 관리에서 열기</button></div>`);
}

/**
 * CSV 셀 값을 RFC 4180 규칙으로 이스케이프한다.
 * @param {*} v 셀 값
 * @returns {string} 이스케이프된 문자열
 */
function csvCell(v) { const s = String(v ?? ''); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }

/**
 * 검사 이력을 CSV(UTF-8 BOM)로 내려받는다.
 * @param {boolean} [all] true 이면 필터와 무관하게 전체 이력 (데이터 관리 화면)
 */
function exportCsv(all) {
  const head = ['번호', '검사ID', 'PCB', '검사시각', 'AI점수', 'AI판정', '최종판정', '당시임계값', '모델버전', '판정사유'];
  const rows = (all === true ? [...S.inspections].sort((a, b) => a.n - b.n) : filteredHistory()).map(r => [r.n, r.id, r.pcb, mdhm(r.at), r.score.toFixed(2), r.ai === 'ANOMALY' ? '이상' : '정상', { PENDING: '검토 대기', NORMAL: '정상', DEFECT: '불량' }[finalState(r)], r.thr.toFixed(2), r.ver, r.memo]);
  const csv = '﻿' + [head, ...rows].map(r => r.map(csvCell).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'CircuitEye_검사이력_20261120.csv'; document.body.appendChild(a); a.click(); a.remove(); toast(`CSV ${rows.length}건 다운로드`);
}

/* ═══════════════════════════════════════════════════════════════════════════
   8-2. [메뉴 5] 통계 분석 — 기간별 추이 · 불량 유형 분포 · TOP 5 (시연용 합성 이력 포함)
   ═══════════════════════════════════════════════════════════════════════════ */
/** 불량 유형 분류 체계 — 샘플 이미지의 데이터셋 정답 라벨(PKU-Market-PCB)을 쓴다. 실제 API는 유형을 반환하지 않으므로 서비스에서는 검사원 분류 입력(후속 확장)이 이 값을 대신한다. */
const DEFECT_TYPES = [
  { id: 'open', c: '#8e5bb5' }, { id: 'short', c: '#3aa38a' }, { id: 'mousebite', c: '#b5651d' }, { id: 'spur', c: '#7a8a99' },
  { id: 'copper', c: '#c76f9a' }, { id: 'missing_hole', c: '#2f8f9d' }, { id: '', c: '#9aa3a0' }
].map(t => ({ ...t, k: t.id ? KIND_KO[t.id] : '미분류' }));
/** 최근 6일 합성 이력 [검사 건수, 불량 건수] (시연용 고정값) + 오늘은 실제 집계 */
const PAST_DAYS = [[104, 9], [118, 11], [97, 8], [126, 12], [112, 10], [109, 9]];

/**
 * 검사 레코드의 불량 유형 id를 돌려준다(이미지의 정답 라벨). 라벨이 없는 업로드 이미지는 '' (미분류).
 * @param {object} r 검사 레코드
 * @returns {string} 유형 id
 */
function defectTypeOf(r) { return (r.boxes && r.boxes[0] && r.boxes[0].k) || ''; }

/**
 * 통계 분석용 집계를 만든다 (기간 7/14일 중 선택, 일별 추이의 과거 일자는 시연용 합성).
 * 불량 유형 분포는 합성 없이 현재 검사 이력(불량 확정 + 검토 대기)의 실제 이미지 라벨로 집계한다.
 * @param {number} days 기간(일)
 * @returns {object} 일별 · 유형별 집계
 */
function statsData(days) {
  const st = getStats();
  const labels = [], tot = [], bad = [];
  const past = days === 14 ? [...PAST_DAYS.map(([a, b]) => [Math.round(a * 0.92), Math.round(b * 1.1)]), ...PAST_DAYS] : PAST_DAYS;
  const base = new Date('2026-11-20T00:00:00+09:00');
  const all = [...past, [st.total, st.defect + st.pending]];
  all.forEach(([t, d], i) => { const dt = new Date(base.getTime() - (all.length - 1 - i) * 86400000); labels.push(`${dt.getMonth() + 1}/${dt.getDate()}`); tot.push(t); bad.push(d); });
  const bads = S.inspections.filter(r => r.final !== 'NORMAL');   // 불량 확정 + 검토 대기
  const byType = DEFECT_TYPES.map(t => ({ ...t, n: bads.filter(r => defectTypeOf(r) === t.id).length })).filter(t => t.n > 0).sort((x, y) => y.n - x.n);
  return { labels, tot, bad, byType, typeTotal: bads.length, sum: tot.reduce((a, b) => a + b, 0), badSum: bad.reduce((a, b) => a + b, 0) };
}

/** 통계 기간 선택(7일/14일)을 바꾼다. */
function setStatDays(d) { U.statDays = d; render(); }

/**
 * 모든 화면이 공유하는 페이지 헤더(제목 · 부제 | 우측 액션 슬롯)를 생성한다.
 * @param {string} title 화면 제목
 * @param {string} [sub] 부제(HTML 허용)
 * @param {string} [act] 우측 액션 영역 HTML(버튼 · 배지 · 기간 토글 등)
 * @returns {string} 헤더 HTML
 */
function pageHead(title, sub, act) {
  return `<div class="page-head"><div><h1 class="page-title">${title}</h1>${sub ? `<p class="page-sub">${sub}</p>` : ''}</div>${act ? `<div class="page-act">${act}</div>` : ''}</div>`;
}

/**
 * 차트 수치를 접근 가능한 데이터 표로 제공한다(화면 낭독기 · 정확한 값 확인용, 기본은 접힘).
 * @param {string[]} head 열 제목
 * @param {Array<Array<string|number>>} rows 행 데이터
 * @returns {string} details 요소 HTML
 */
function chartTable(head, rows) {
  return `<details class="tbl-toggle"><summary>표로 보기</summary><table><thead><tr>${head.map(x => `<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></details>`;
}

/** 대시보드 시간대 막대 클릭: 해당 시간대의 검사 이력으로 이동한다. @param {number} hr 시(0~23) */
function gotoHour(hr) { U.hf = { period: 'all', pcb: 'all', result: 'all', q: '', hour: hr }; go('history'); }

/**
 * 다운로드 파일명을 만든다(검사 ID + 이미지 형식 확장자).
 * @param {object} r 검사 레코드
 * @returns {string} 예: INS-000120.png
 */
function dlName(r) {
  const src = r.img || '', m = /^data:image\/(\w+)/.exec(src);
  const ext = m ? (m[1] === 'jpeg' ? 'jpg' : m[1]) : ((/\.(\w{3,4})$/.exec(src) || [])[1] || 'png');
  return `${r.id}.${ext}`;
}

/**
 * 검사 이미지를 파일로 내려받는다.
 * 같은 출처(배포 주소)에서는 Blob으로 바로 저장하고, file:// 로 직접 열었을 때처럼 브라우저가 fetch·download 속성을 막으면
 * 새 탭에서 이미지를 열어 '다른 이름으로 저장'하도록 안내한다.
 * @param {number} n 검사 번호
 */
async function downloadImage(n) {
  const r = S.inspections.find(x => x.n === n); if (!r) return;
  try {
    const blob = await (await fetch(r.img)).blob(), url = URL.createObjectURL(blob);
    const a = Object.assign(document.createElement('a'), { href: url, download: dlName(r) });
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1500);
    toast(`${dlName(r)} 저장을 시작했습니다`);
  } catch (e) {
    window.open(r.img, '_blank');
    toast('새 탭에서 이미지를 열었습니다 — 마우스 오른쪽 버튼으로 저장하세요');
  }
}

/** 확대 뷰어 상태: s=배율(1~6), x·y=이동량(px) */
const VZ = { s: 1, x: 0, y: 0 };

/** 확대 뷰어의 현재 배율·이동을 화면에 반영한다(이동은 이미지가 화면 밖으로 벗어나지 않게 제한). */
function vzApply() {
  const box = document.getElementById('vz'), inn = document.getElementById('vzIn'); if (!box || !inn) return;
  const w = box.clientWidth, hh = box.clientHeight;
  VZ.x = Math.min(0, Math.max(w - w * VZ.s, VZ.x)); VZ.y = Math.min(0, Math.max(hh - hh * VZ.s, VZ.y));
  inn.style.transform = `translate(${VZ.x}px,${VZ.y}px) scale(${VZ.s})`;
  box.classList.toggle('zoomed', VZ.s > 1);
  const pct = document.getElementById('vzPct'); if (pct) pct.textContent = Math.round(VZ.s * 100) + '%';
}

/**
 * 지정한 지점을 기준으로 확대·축소한다.
 * @param {number} f 배율 변화 비율(1.25 = 25% 확대)
 * @param {number} [cx] 기준점 x(뷰어 안 좌표, 기본 중앙)
 * @param {number} [cy] 기준점 y
 */
function vzZoom(f, cx, cy) {
  const box = document.getElementById('vz'); if (!box) return;
  cx = cx ?? box.clientWidth / 2; cy = cy ?? box.clientHeight / 2;
  const ns = Math.min(6, Math.max(1, VZ.s * f)), k = ns / VZ.s;
  VZ.x = cx - (cx - VZ.x) * k; VZ.y = cy - (cy - VZ.y) * k; VZ.s = ns; vzApply();
}

/** 확대 뷰어를 원래 크기(맞춤)로 되돌린다. */
function vzReset() { VZ.s = 1; VZ.x = 0; VZ.y = 0; vzApply(); }

/**
 * 검사 이미지를 크게 보는 뷰어를 연다 — 휠·버튼 확대/축소, 끌어서 이동, 더블클릭 확대, 다운로드.
 * 관리자가 검사 관리에서 AI 판단 근거(Heatmap·Mask·Overlay)를 선택해 둔 상태면 같은 표시를 이미지 위에 겹쳐 보여 준다.
 * @param {number} n 검사 번호
 */
function openViewer(n) {
  const r = S.inspections.find(x => x.n === n); if (!r) return;
  Object.assign(VZ, { s: 1, x: 0, y: 0 });
  const ev = isAdmin() && U.evMode !== 'orig' && r.ai === 'ANOMALY';
  openModal(`<div class="row between mb8"><b style="font-size:18px">${r.id} · ${pcbTag(r.pcb)}</b><button class="icon-btn" onclick="closeModal()" aria-label="닫기">${ic('x')}</button></div>
    <div class="vz" id="vz"><div class="vz-in" id="vzIn"><img src="${r.img}" alt="${r.id} 원본" draggable="false" style="${ev && U.evMode === 'mask' ? 'visibility:hidden' : ''}">${ev ? evidenceLayer(r, U.evMode, U.evOpacity) : ''}${ev && U.evMode === 'mask' ? '' : markerHtml(r)}</div></div>
    <div class="row between mt10"><div class="row"><button class="btn sm" onclick="vzZoom(1/1.25)" aria-label="축소">−</button><span id="vzPct" class="small muted" style="min-width:48px;text-align:center">100%</span><button class="btn sm" onclick="vzZoom(1.25)" aria-label="확대">+</button><button class="btn sm outline" onclick="vzReset()">맞춤</button></div>
      <div class="row">${r.ai === 'ANOMALY' ? markBtn() : ''}<button class="btn sm primary" onclick="downloadImage(${r.n})">${ic('download')}이미지 다운로드</button></div></div>
    <div class="note">마우스 휠 · +/− 로 확대·축소, 끌어서 이동, 더블클릭으로 확대/복귀. 다운로드는 표시 없는 원본 이미지입니다(빨간 박스${ev ? ' · 판단 근거 표시' : ''}는 화면용).</div>`);
  document.querySelector('.modal-card').classList.add('wide');
  const box = document.getElementById('vz'); let p = null;
  const pos = e => { const b = box.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  box.addEventListener('wheel', e => { e.preventDefault(); const [cx, cy] = pos(e); vzZoom(e.deltaY < 0 ? 1.2 : 1 / 1.2, cx, cy); }, { passive: false });
  box.addEventListener('dblclick', e => { const [cx, cy] = pos(e); if (VZ.s > 1) vzReset(); else vzZoom(2.5, cx, cy); });
  box.addEventListener('pointerdown', e => { e.stopPropagation(); if (VZ.s <= 1) return; p = { x: e.clientX, y: e.clientY, sx: VZ.x, sy: VZ.y }; box.setPointerCapture(e.pointerId); box.classList.add('pan'); });
  box.addEventListener('pointermove', e => { if (!p) return; VZ.x = p.sx + e.clientX - p.x; VZ.y = p.sy + e.clientY - p.y; vzApply(); });
  const end = () => { p = null; box.classList.remove('pan'); };
  box.addEventListener('pointerup', end); box.addEventListener('pointercancel', end);
}
document.addEventListener('keydown', e => {
  if (!document.getElementById('vz') || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (e.key === '+' || e.key === '=') vzZoom(1.25); else if (e.key === '-') vzZoom(1 / 1.25); else if (e.key === '0') vzReset();
});

/** 도넛 범례에 마우스를 올리면 해당 유형의 호만 강조한다. @param {string} [k] 유형명(없으면 해제) */
function hiArc(k) { document.querySelectorAll('circle.arc').forEach(c => { c.style.opacity = !k || c.dataset.k === k ? '' : '.3'; }); }

/** 모바일(700px 이하) 하단 탭의 '더보기': 통계·데이터·모델·설정 시트를 연다. */
function openMore() {
  const adm = isAdmin();
  openModal(`<div class="row between"><b style="font-size:18px">더보기</b><button class="icon-btn" onclick="closeModal()" aria-label="닫기">${ic('x')}</button></div>
    <div class="more-grid">${MENUS.filter(m => m.sec).map(m => `<button class="more-item ${U.route === m.id ? 'on' : ''}" onclick="closeModal();go('${m.id}')">${ic(m.icon, 'lg')}<span>${m.label}</span>${m.adminEdit && !adm ? `<span class="lk2" title="조회 전용">${ic('lock')}</span>` : ''}</button>`).join('')}</div>`);
}

/* 차트 툴팁: data-tip 속성이 있는 요소 위(터치는 누르는 동안)에 말풍선을 띄운다. */
(function initTip() {
  let el = null;
  const tip = () => el || (el = Object.assign(document.createElement('div'), { id: 'tip' }), document.body.appendChild(el), el);
  const show = e => {
    const t = e.target.closest && e.target.closest('[data-tip]'), box = tip();
    if (!t) { box.classList.remove('on'); return; }
    box.textContent = t.dataset.tip; box.classList.add('on');
    const w = box.offsetWidth, hgt = box.offsetHeight;
    box.style.left = Math.min(window.innerWidth - w - 8, Math.max(8, e.clientX + 12)) + 'px';
    box.style.top = (e.clientY - hgt - 12 < 8 ? e.clientY + 18 : e.clientY - hgt - 12) + 'px';
  };
  const hide = () => { if (el) el.classList.remove('on'); };
  document.addEventListener('pointermove', show); document.addEventListener('pointerdown', show);
  document.addEventListener('pointerup', e => { if (e.pointerType === 'touch') setTimeout(hide, 1200); });
  document.addEventListener('scroll', hide, true); window.addEventListener('blur', hide);
})();

/** 일별 검사 추이 라인 차트(SVG): 전체 검사 · 불량. */
function trendChart(d) {
  const W = 520, H = 220, L = 50, R = 18, T = 16, B = 28, n = d.labels.length;
  const max = Math.ceil(Math.max(...d.tot) / 40) * 40, X = i => L + (W - L - R) * i / (n - 1), Y = v => T + (H - T - B) * (1 - v / max);
  const line = (arr, c, nm) => `<polyline class="draw" fill="none" stroke="${c}" stroke-width="2.4" stroke-linejoin="round" points="${arr.map((v, i) => `${X(i)},${Y(v)}`).join(' ')}"/>${arr.map((v, i) => `<circle class="pt" style="animation-delay:${0.35 + i * 0.12}s" cx="${X(i)}" cy="${Y(v)}" r="3.2" fill="${c}"/><circle class="hit" cx="${X(i)}" cy="${Y(v)}" r="13" data-tip="${d.labels[i]} · ${nm} ${v}건"/>${n <= 8 ? `<text class="pt ct" style="animation-delay:${0.35 + i * 0.12}s" x="${X(i) + (i === 0 ? 4 : i === n - 1 ? -4 : 0)}" y="${Y(v) - 8}" text-anchor="${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}" font-size="10.5" fill="var(--text-2)">${v}</text>` : ''}`).join('')}`;
  const grid = [0, .25, .5, .75, 1].map(f => `<line x1="${L}" x2="${W - R}" y1="${Y(max * f)}" y2="${Y(max * f)}" stroke="var(--border)"/><text class="ct" x="${L - 8}" y="${Y(max * f) + 4}" text-anchor="end" font-size="10.5" fill="var(--text-3)">${Math.round(max * f)}</text>`).join('');
  const xl = d.labels.map((l, i) => (n <= 8 || i % 2 === 0) ? `<text class="ct" x="${X(i)}" y="${H - 8}" text-anchor="middle" font-size="10.5" fill="var(--text-3)">${l}</text>` : '').join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="일별 검사 건수 추이">${grid}${xl}${line(d.tot, 'var(--bar-normal)', '전체 검사')}${line(d.bad, 'var(--bar-defect)', '불량·대기')}</svg>
    <div class="row small muted" style="gap:14px"><span><span class="dot" style="color:var(--bar-normal);display:inline-block"></span> 전체 검사</span><span><span class="dot" style="color:var(--bar-defect);display:inline-block"></span> 불량·대기</span></div>${chartTable(['일자', '전체 검사', '불량·대기'], d.labels.map((l, i) => [l, d.tot[i], d.bad[i]]))}`;
}

/** 불량 유형 도넛 차트(SVG). */
function donutChart(byType) {
  const total = byType.reduce((a, t) => a + t.n, 0) || 1, R = 62, C = 2 * Math.PI * R; let off = 0;
  const arcs = byType.map(t => { const len = C * t.n / total, s = `<circle class="arc" data-k="${t.k}" data-tip="${t.k} · ${t.n}건 (${(t.n / total * 100).toFixed(1)}%)" data-len="${len}" data-off="${off}" data-c="${C}" r="${R}" cx="80" cy="80" fill="none" stroke="${t.c}" stroke-width="24" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"/>`; off += len; return s; }).join('');
  return `<svg viewBox="0 0 160 160" width="170" role="img" aria-label="불량 유형별 분포">${arcs}<text x="80" y="76" text-anchor="middle" font-size="11" fill="var(--text-3)">불량 건수</text><text x="80" y="98" text-anchor="middle" font-size="20" font-weight="800" fill="var(--text-1)">${total}</text></svg>`;
}

/**
 * 불량 유형별 분포(도넛 + 범례)를 생성한다. 통계 분석(SC-07)과 대시보드(SC-01)가 같은 마크업을 공유해 숫자·색이 어긋나지 않게 한다.
 * @param {{k: string, c: string, n: number}[]} byType 유형명 · 색 · 건수 (statsData().byType)
 * @returns {string} 도넛 SVG + 범례 HTML
 */
function defectDist(byType) {
  if (!byType.length) return `<div class="empty">불량 확정·검토 대기 건이 없습니다.</div>`;
  const tot = byType.reduce((a, t) => a + t.n, 0) || 1;
  return `<div class="donut-wrap">${donutChart(byType)}<div>${byType.map(t => `<div class="legend-row" data-k="${t.k}" onmouseenter="hiArc(this.dataset.k)" onmouseleave="hiArc()"><i style="background:${t.c}"></i>${t.k} <b>${t.n}</b> <span class="muted">${(t.n / tot * 100).toFixed(1)}%</span></div>`).join('')}</div></div>`;
}

/**
 * 통계 분석 화면을 생성한다.
 * @returns {string} 본문 HTML
 */
function viewStats() {
  const days = U.statDays || 7, d = statsData(days), st = getStats();
  const rate = (d.badSum / d.sum * 100).toFixed(1), avgMs = Math.round(S.inspections.reduce((a, r) => a + r.ms, 0) / S.inspections.length);

/* ═══════════════════════════════════════════════════════════════════════════
   8-3. [메뉴 6] 데이터 관리 — 현황 · CSV 가져오기(컬럼 매핑 시연) · 내보내기 · 보관·정리
   ═══════════════════════════════════════════════════════════════════════════ */
/** 가져오기 표준 항목 (컬럼 매핑 대상) */
const IMPORT_FIELDS = [['pcb', 'PCB ID', ['pcb', 'pcb id', '제품', '제품id']], ['at', '검사 일시', ['검사시각', '검사일시', 'datetime', 'time', '일시']], ['result', '판정 결과', ['판정', '결과', 'result', '최종판정']], ['score', '이상 점수', ['점수', 'score', 'ai점수', 'anomaly']]];

/** CSV 한 줄을 셀 배열로 파싱한다 (따옴표 지원). */
function parseCsvLine(line) {
  const out = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++) { const c = line[i];
    if (q) { if (c === '"' && line[i + 1] === '"') { cur += '"'; i++; } else if (c === '"') q = false; else cur += c; }
    else if (c === '"') q = true; else if (c === ',') { out.push(cur); cur = ''; } else cur += c; }
  out.push(cur); return out;
}

/** 선택한 CSV 파일을 읽어 컬럼 매핑 미리보기를 만든다 (저장하지 않음). */
function onImportFile(inp) {
  const f = inp.files && inp.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    const lines = String(rd.result).replace(/^﻿/, '').split(/\r?\n/).filter(x => x.trim());
    if (lines.length < 2) return toast('데이터 행이 없는 파일입니다');
    const head = parseCsvLine(lines[0]), rows = lines.slice(1).map(parseCsvLine);
    const map = {}; IMPORT_FIELDS.forEach(([k, , alias]) => { const i = head.findIndex(h => alias.includes(h.trim().toLowerCase())); map[k] = i; });
    U.imp = { name: f.name, head, rows, map }; render(); toast(`${f.name} · ${rows.length}행을 읽었습니다`);
  };
  rd.readAsText(f, 'utf-8');
}

/** 컬럼 매핑 선택을 바꾼다. */
function setImportMap(k, v) { U.imp.map[k] = +v; render(); }

/** 매핑 검증 후 가져오기 완료를 안내한다 (시연: 저장하지 않음). */
function runImport() {
  const m = U.imp.map, miss = IMPORT_FIELDS.filter(([k]) => m[k] < 0).map(([, l]) => l);
  if (miss.length) return toast('매핑이 필요한 항목: ' + miss.join(', '));
  toast(`${U.imp.rows.length}행 검증 완료 · 데모에서는 저장하지 않습니다 (실서비스: 표준 스키마로 적재)`);
}

  const csv = '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));

 */
function toggleUser(i) {
  const u = S.users[i]; if (u.name === S.user.name) return toast('본인 계정은 비활성화할 수 없습니다');
  u.status = u.status === '활성' ? '비활성' : '활성'; render();
}

/**
 * 시스템 설정 화면을 생성한다.
 * @returns {string} 본문 HTML
 */
function viewSettings() {
  const adm = isAdmin(), opt = (arr, cur) => arr.map(x => `<option ${x === cur ? 'selected' : ''}>${x}</option>`).join('');
  const bytes = S.inspections.length * 0.153;
  return `${pageHead('시스템 설정', '카메라 · 저장소 · 사용자 관리')}
    ${adm ? '' : `<div class="mode-note">${ic('lock', 'lg')}<span><b>부분 조회</b> — 카메라 설정만 변경할 수 있고, 보관 기간·사용자 관리는 관리자만 수정할 수 있습니다.</span></div>`}
    <div class="grid2"><div class="card"><div class="card-title">${ic('camera', 'lg')}카메라</div>
        <div class="field"><label>촬영 장치</label><select class="inp" onchange="setSetting('camera',this.value)">${opt(['기본 카메라 (USB 현미경)', '노트북 내장 카메라', '이미지 업로드만 사용'], S.settings.camera)}</select></div>
        <div class="field"><label>촬영 해상도</label><select class="inp" onchange="setSetting('resolution',this.value)">${opt(['1280 × 720', '1920 × 1080', '3840 × 2160'], S.settings.resolution)}</select></div>
        <div class="note">촬영 품질 자동 검사 · Best Frame 선정은 후속 확장 항목입니다.</div></div>
      <div class="card"><div class="card-title">${ic('db', 'lg')}저장소</div>
        <div class="row between small"><span class="muted">검사 이미지 · 결과</span><b>${bytes.toFixed(1)} GB / 100 GB</b></div><div class="usage" style="margin:6px 0 12px"><i style="width:${bytes}%"></i></div>
        <div class="field"><label>이미지 보관 기간</label><select class="inp" ${adm ? '' : 'disabled'} onchange="setSetting('retention',this.value)">${opt(['30일', '90일', '180일', '1년'], S.settings.retention)}</select></div>
        <div class="muted small">저장 위치: <code>/storage/inspections</code></div></div></div>
    <div class="card"><div class="card-title">${ic('lock', 'lg')}사용자 관리<span class="sp"></span>${adm ? `<button class="btn sm primary" onclick="openUserForm()">${ic('plus')}사용자 추가</button>` : '<span class="pill">조회 전용</span>'}</div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>이름</th><th>소속</th><th>역할</th><th>상태</th>${adm ? '<th>관리</th>' : ''}</tr></thead><tbody>
      ${S.users.map((u, i) => `<tr><td><b>${esc(u.name)}</b>${u.name === S.user.name ? ' <span class="pill">나</span>' : ''}</td><td>${esc(u.company)}</td><td>${u.role}</td><td><span class="pill ${u.status === '활성' ? 'green' : ''}">${u.status}</span></td>${adm ? `<td><button class="btn sm outline" ${u.name === S.user.name ? 'disabled title="본인 계정은 비활성화할 수 없습니다"' : ''} onclick="toggleUser(${i})">${u.status === '활성' ? '비활성화' : '활성화'}</button></td>` : ''}</tr>`).join('')}</tbody></table></div></div>
    <div class="card"><div class="card-title">참고</div><div class="muted">담당자 피드백에 따라 <b>추론 서버 설정</b>은 MVP 범위에서 제외했습니다. PatchCore API 엔드포인트와 인증키는 서버 환경변수로 고정 관리합니다.</div></div>`;
}

/* ═══════════════════════════════════════════════════════════════════════════
   11. 렌더링 · 데모 초기화 · 부트스트랩
   ═══════════════════════════════════════════════════════════════════════════ */
/** 현재 상태(로그인 여부 · 라우트)에 맞게 #app 전체를 다시 그린다. 스크롤 위치는 유지한다. */
function render() {
  const app = document.getElementById('app'), prev = document.querySelector('.main'), top = prev ? prev.scrollTop : 0;
  if (!S.user) { app.innerHTML = viewLogin(); playEnter(app); return; }
  const views = { dashboard: viewDashboard, inspect: viewInspect, review: viewReview, history: viewHistory, stats: viewStats, data: viewData, models: viewModels, settings: viewSettings };
  app.innerHTML = shell((views[U.route] || viewDashboard)());
  const m = document.querySelector('.main'); if (m) m.scrollTop = top;
  playEnter(app);
}

/** 데모 데이터를 초기 상태(120건)로 되돌린다. 테마와 로그인은 유지한다. */
function resetDemo() {
  Object.values(S.banks).forEach(a => a.forEach(f => f.src && URL.revokeObjectURL(f.src)));   // 데이터뱅크 미리보기 Blob URL 해제
  S = createInitialState({ theme: S.theme, user: S.user, api: S.api }); U.rvSel = null; U.rvQ = ''; U.rvFilter = 'all'; U.hf = { period: 'all', pcb: 'all', result: 'all', q: '' }; U.hpage = 1; U.anim = true;
  U.queue = [newQueueItem({ ...sampleItem(SAMPLE_NORM[0]), name: '샘플 촬영 이미지' })]; U.capSeq = 0; U.bankPcb = 'PCB1'; render(); toast('데모 데이터를 초기화했습니다');
}

/* ═══════════════════════════════════════════════════════════════════════════
   12. 환경별 UI 데모 뷰어 — 데스크톱 · 태블릿 · 스마트폰 · 나란히 보기
   (실제 웹은 별도 구현 예정, 이 파일은 환경별 UI 구조 시연용)
   ═══════════════════════════════════════════════════════════════════════════ */
/** 데모 뷰어 환경 정의 (해상도는 앱 내부 CSS 분기점 900px / 520px 과 대응) */
const ENVS = { desktop: { w: 1280, h: 800, label: '데스크톱 콘솔', cap: '1280 × 800 · 좌측 8메뉴' },
               tablet:  { w: 820, h: 1100, label: '태블릿', cap: '820 × 1100 · 하단 탭바' },
               phone:   { w: 390, h: 800, label: '스마트폰', cap: '390 × 800 · 하단 탭바' } };
/** 뷰어 선택 상태 (환경 · 권한 · 테마 · 시작 화면) */
const V = { env: 'desktop', role: 'admin', theme: 'light', route: 'dashboard' };

/**
 * 임베드 앱의 URL을 만든다 (embed=1 은 뷰어 재진입 방지).
 * @param {boolean} [embed] false 이면 새 창용 URL
 * @returns {string} URL
 */
function viewerSrc(embed = true) {
  return location.href.split(/[?#]/)[0] + `?${embed ? 'embed=1&' : ''}role=${V.role}&theme=${V.theme}#${V.route}`;
}

/** 뷰어 상단바 · 기기 프레임을 그린다. 옵션 변경 시 iframe을 새로 불러온다. */
function renderViewer() {
  const seg = (key, items) => `<div class="vw-seg">${items.map(([v, l]) => `<button class="${V[key] === v ? 'on' : ''}" onclick="V.${key}='${v}';renderViewer()">${l}</button>`).join('')}</div>`;
  const dev = k => `<div><div class="vw-dev ${k === 'phone' ? 'phone' : ''}"><iframe title="${ENVS[k].label}" width="${ENVS[k].w}" height="${ENVS[k].h}" src="${viewerSrc()}"></iframe></div><div class="vw-cap">${ENVS[k].label} · ${ENVS[k].cap}</div></div>`;
  const keys = V.env === 'all' ? ['desktop', 'tablet', 'phone'] : [V.env];
  document.getElementById('app').innerHTML = `<div class="vw">
    <div class="vw-bar"><div class="brand"><img src="./docs/assets/circuiteye_icon_256.png" alt="">CircuitEye<small>환경별 UI 데모</small></div>
      ${seg('env', [['desktop', '데스크톱'], ['tablet', '태블릿'], ['phone', '스마트폰'], ['all', '나란히 보기']])}
      ${seg('role', [['admin', '관리자'], ['inspector', '검사원']])}
      <select class="inp" style="width:auto" onchange="V.route=this.value;renderViewer()">${[['login', '로그인'], ...MENUS.map(m => [m.id, m.label])].map(([v, l]) => `<option value="${v}" ${V.route === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
      ${seg('theme', [['light', '라이트'], ['dark', '다크']])}
      <span style="flex:1"></span><a class="btn sm outline" href="${viewerSrc(false)}" target="_blank" rel="noopener">새 창으로 열기</a></div>
    <div class="vw-stage" id="vwStage"><div class="vw-row" id="vwRow">${keys.map(dev).join('')}</div></div></div>`;
  fitViewer();
}

/** 기기 프레임 묶음을 스테이지 크기에 맞게 축소한다 (확대는 하지 않음). */
function fitViewer() {
  const st = document.getElementById('vwStage'), row = document.getElementById('vwRow'); if (!st || !row) return;
  row.style.transform = 'none'; const w = row.offsetWidth + 40, h = row.offsetHeight + 40;
  const s = Math.min(1, st.clientWidth / w, st.clientHeight / h); row.style.transform = `scale(${s})`;
}

/**
 * 진입 해시·쿼리를 해석해 초기 화면을 결정한다.
 * 해시: #login · #dashboard · #inspect · #review · #history · #stats · #data · #models · #settings (+ '-dark')
 * 쿼리: ?theme=dark · ?nosplash=1 · ?role=inspector
 */
function initBoot() {
  const q = new URLSearchParams(location.search);
  let h = location.hash.replace('#', '');
  // 파라미터 없이 열면 환경별 UI 데모 뷰어를 보여준다 (앱 직접 진입: ?app=1 · 해시 · ?embed=1)
  if (!h && !q.get('app') && !q.get('embed') && !q.get('nosplash') && !q.get('theme') && !q.get('role')) { document.getElementById('splash').remove(); renderViewer(); window.addEventListener('resize', fitViewer); return; }
  if (h.endsWith('-dark') || q.get('theme') === 'dark') { applyTheme('dark'); h = h.replace('-dark', ''); }
  const legacy = { console: 'dashboard', workspace: 'review', mobile: 'inspect' };   // v1.1 해시 호환
  h = legacy[h] || h;
  const splash = document.getElementById('splash');
  if (MENUS.some(m => m.id === h)) { S.user = { ...(q.get('role') === 'inspector' ? PRESETS.abov : PRESETS.khaki) }; U.route = h; }
  render();
  if (h || q.get('nosplash')) { splash.remove(); }
  else setTimeout(() => { splash.classList.add('out'); setTimeout(() => splash.remove(), 400); }, 1000);
}
initBoot();

/**
 * 마우스로 꾹 누른 채 끌어서 스크롤하는 기능(드래그 스크롤).
 * - 포인터 위치에서 위로 올라가며 실제로 스크롤 가능한 첫 컨테이너를 찾아 그 컨테이너를 움직인다.
 * - 5px 이상 움직여야 드래그로 인정하며, 드래그 직후의 클릭은 막아 버튼 오작동을 방지한다.
 * - 입력창·선택창·슬라이더·이미지 드래그는 제외한다. 터치는 브라우저 기본 스크롤을 그대로 사용한다.
 */
(function enableDragScroll() {
  let d = null, moved = false;
  const canScroll = (el, axis) => {
    const cs = getComputedStyle(el), o = axis === 'x' ? cs.overflowX : cs.overflowY;
    return /(auto|scroll)/.test(o) && (axis === 'x' ? el.scrollWidth > el.clientWidth : el.scrollHeight > el.clientHeight);
  };
  const findScroller = t => { for (let el = t; el && el !== document.documentElement; el = el.parentElement) if (canScroll(el, 'x') || canScroll(el, 'y')) return el; return null; };
  document.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'mouse' || e.button !== 0 || e.target.closest('input,select,textarea,label,[contenteditable]')) return;
    const el = findScroller(e.target); if (!el) return;
    d = { el, x: e.clientX, y: e.clientY, sx: el.scrollLeft, sy: el.scrollTop }; moved = false;
  });
  document.addEventListener('pointermove', e => {
    if (!d) return;
    const dx = e.clientX - d.x, dy = e.clientY - d.y;
    if (!moved && Math.hypot(dx, dy) < 5) return;
    if (!moved) { moved = true; document.body.classList.add('dragging'); }
    d.el.scrollLeft = d.sx - dx; d.el.scrollTop = d.sy - dy;
  });
  const end = () => { if (d && moved) { document.body.classList.remove('dragging'); const stop = ev => { ev.stopPropagation(); ev.preventDefault(); }; document.addEventListener('click', stop, { capture: true, once: true }); setTimeout(() => document.removeEventListener('click', stop, true), 0); } d = null; };
  document.addEventListener('pointerup', end); document.addEventListener('pointercancel', end);
  document.addEventListener('dragstart', e => { if (e.target.tagName === 'IMG') e.preventDefault(); });
})();
</script>
